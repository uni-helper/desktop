ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@antfu/skills@0.1.0'

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - playground
  - docs
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  electron: true
  simple-git-hooks: true

catalogs:
  agentic:
    '@antfu/skills': ^0.1.0
    skills: ^1.7.2
  cli:
    '@antfu/eslint-config': ^9.5.1
    bumpp: ^12.3.0
    eslint: ^10.11.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.38.0
    nano-staged: ^1.0.2
    simple-git-hooks: ^2.14.0
    taze: ^21.2.0
    tsdown: ^0.23.0
    typescript: ^6.0.3
  testing:
    happy-dom: ^21.0.4
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.5.0
    vitest: ^5.0.2
  types:
    '@types/node': ^26.6.3
